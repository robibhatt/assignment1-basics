out:
  debug: false
  profile: true
  seed: 123
  home_dir: "experiments/test"
  checkpoint_interval: 1000
  log_interval: 2
  val_batches: 1
  use_wandb: true
  wandb_entity: "testjkw"

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0
  dtype: "float32"
  weight_tying: true

data:
  train_text_path: data/TinyStoriesV2-GPT4/TinyStoriesV2-GPT4-train.txt
  val_text_path: data/TinyStoriesV2-GPT4/TinyStoriesV2-GPT4-valid.txt
  tokenizer_dir: data/TinyStoriesV2-GPT4/tokenizer
  num_workers: 5
  pretoken_chunk_size: 64000
  special_tokens: []
  tokenizer_chunk_size: 64000
  batch_size: 32

optim:
  lr: 5.0e-5
  betas:
    - 0.9
    - 0.99
  weight_decay: 1.0e-4
  opt_eps: 1.0e-8
  max_norm: 1.0
  grad_clip_eps: 1.0e-6
  total_step_count: 10000
  warmup_steps: 1
  alpha_min: 1.0e-6
  alpha_max: 1.0e-4