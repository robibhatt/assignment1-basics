# sweep.yaml
method: bayes
metric:
  name: valid/loss
  goal: minimize
run_cap: 5              # stop globally after 40 runs

early_terminate:         # prune bad configs early
  type: hyperband
  min_iter: 3            # min checkpoints before considering stopping
  s: 2                   # aggressiveness of pruning (2 = moderate)

command:
  - uv
  - run
  - scripts/run_train.py

parameters:
  # --- Core learning parameters ---
  lr:
    distribution: log_uniform
    min: 1e-5
    max: 5e-3

  weight_decay:
    distribution: log_uniform
    min: 1e-7
    max: 1e-3

  opt_eps:
    distribution: log_uniform
    min: 1e-9
    max: 1e-6

  grad_clip_eps:
    distribution: log_uniform
    min: 1e-8
    max: 1e-4

  alpha_min:
    distribution: log_uniform
    min: 1e-7
    max: 1e-5

  alpha_max:
    distribution: log_uniform
    min: 1e-5
    max: 1e-3

  warmup_steps:
    values: [100, 300, 600, 1000]
